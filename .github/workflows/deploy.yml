name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy al VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # workflow_run NO hace checkout del commit que disparo el evento: sin ref
      # explicito baja el HEAD de la rama por defecto y podria deployar otro
      # codigo que el que el CI verifico.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Sin los secrets cargados el job termina limpio en vez de fallar en rojo.
      # Cargarlos requiere permiso de admin en el repo.
      - name: Verificar credenciales
        id: creds
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::VPS_SSH_KEY no esta configurado; se saltea el deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar SSH
        if: steps.creds.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          set -e
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Faltan VPS_HOST o VPS_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT=${PORT:-52070}
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # falla aca y no en el rsync si el host no responde
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 "${USER_:-dataminers}@$HOST" true

      - name: rsync al servidor
        if: steps.creds.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          DEST: ${{ secrets.VPS_PATH }}
        run: |
          PORT=${PORT:-52070}
          USER_=${USER_:-dataminers}
          DEST=${DEST:-/srv/ganf/current/}
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' --exclude 'setup.sql' --exclude 'upgrade_sgrsi.sql' \
            -e "ssh -p $PORT" ./ "$USER_@$HOST:$DEST"

      # Verificacion desde la nube, sin credenciales: la autenticacion la hace
      # la app contra la tabla `usuarios` de MariaDB, no nginx.
      #   /                 -> 200
      #   /api/sesion       -> 401 con JSON (no hay sesion)
      #   login invalido    -> 401 "Credenciales invalidas"
      # Si MariaDB no responde, la API devuelve 500 y este paso falla.
      - name: Verificar el deploy desde la nube
        if: steps.creds.outputs.ready == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -e
          URL=${SITE_URL:-https://ganf.dataminers.lat}
          echo "Verificando $URL"

          home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL/")
          echo "GET /                  -> $home"
          [ "$home" = "200" ]

          api=$(curl -s -o /tmp/api.json -w '%{http_code}' --max-time 15 "$URL/api/auth.php?accion=sesion")
          cat /tmp/api.json; echo
          echo "GET /api/sesion        -> $api"
          [ "$api" = "401" ]
          grep -q '"status"' /tmp/api.json

          login=$(curl -s -o /tmp/login.json -w '%{http_code}' --max-time 15 \
            -X POST "$URL/api/auth.php?accion=login" \
            -d "correo=deploy-check@invalid.local" -d "clave=deploy-check-invalid")
          cat /tmp/login.json; echo
          echo "POST login invalido    -> $login"
          [ "$login" = "401" ]
          grep -q 'Credenciales inv' /tmp/login.json

      - name: Resumen
        run: |
          if [ "${{ steps.creds.outputs.ready }}" = "true" ]; then
            echo "### Deploy publicado y verificado" >> "$GITHUB_STEP_SUMMARY"
            echo "Commit \`${{ github.event.workflow_run.head_sha }}\` copiado al VPS y comprobado desde la nube." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy salteado" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secrets \`VPS_SSH_KEY\`, \`VPS_HOST\`, \`VPS_USER\`, \`VPS_PORT\` (\`SITE_URL\` es opcional)." >> "$GITHUB_STEP_SUMMARY"
          fi
